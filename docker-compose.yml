# =============================================================================
# oc-stack — 全 Docker 一键栈
#
#     公网 443 ──> caddy ──┬──> openchamber:3000 ──> opencode（容器内）
#                          │
#                          └──> sub2api:8080 ──> 上游模型 API
#
# 所有端口都不映射到宿主机公网。只有 caddy 暴露 80/443。
# 用法见仓库根目录 README，或直接 ./ocstack up
# =============================================================================

name: oc-stack

services:
  # ---------------------------------------------------------------------------
  # Caddy：自动申请 + 自动续期证书，反代 WebSocket 和 SSE
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:${CADDY_VERSION:-2.11}
    container_name: oc-caddy
    restart: unless-stopped
    ports:
      # 端口可在 .env 里改（CADDY_HTTP_PORT / CADDY_HTTPS_PORT），
      # 用于 80/443 已被 nginx 等占用、需要放在前置反代后面的场景
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
      # IP 模式的两个明文入口直接在这里映射（端口来自 .env，安装时探测空闲值）。
      # 有域名时这两个端口不会被 Caddy 监听（Caddyfile 里没有对应站点），
      # 所以不会额外暴露服务。
      - "${HTTP_PORT:-18080}:${HTTP_PORT:-18080}"
      - "${API_HTTP_PORT:-18081}:${API_HTTP_PORT:-18081}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - OC_DOMAIN=${OC_DOMAIN:-}
      - API_DOMAIN=${API_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
    depends_on:
      - openchamber
    networks:
      - oc-net
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # OpenChamber + OpenCode（从本仓库 Dockerfile 构建）
  # ---------------------------------------------------------------------------
  openchamber:
    build:
      context: .
      dockerfile: docker/Dockerfile.openchamber
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.2.6}
        OPENCHAMBER_VERSION: ${OPENCHAMBER_VERSION:-2.7.0}
    image: oc-stack/openchamber:${OPENCHAMBER_VERSION:-2.7.0}
    container_name: oc-openchamber
    restart: unless-stopped
    # 不映射端口到宿主机，只通过 caddy 访问；调试可临时开 127.0.0.1:3000
    expose:
      - "3000"
    volumes:
      - ./data/openchamber:/home/openchamber/.config/openchamber
      - ./data/opencode/share:/home/openchamber/.local/share/opencode
      - ./data/opencode/state:/home/openchamber/.local/state/opencode
      - ./data/opencode/config:/home/openchamber/.config/opencode
      - ./workspaces:/workspace
    environment:
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?请在 .env 里设置 OPENCHAMBER_UI_PASSWORD}
      SUB2API_API_KEY: ${SUB2API_API_KEY:-}
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-http://sub2api:8080/v1}
      SUB2API_MODEL: ${SUB2API_MODEL:-deepseek/deepseek-v4.1-flash}
      SUB2API_MODEL_ALIAS: ${SUB2API_MODEL_ALIAS:-deepseek-v4.1-flash}
      SUB2API_MODEL_NAME: ${SUB2API_MODEL_NAME:-DeepSeek V4.1 Flash}
      HOME: /home/openchamber
    depends_on:
      sub2api:
        condition: service_healthy
        # 外接已有网关时 sub2api 不启动，这里必须允许缺失
        required: false
    networks:
      - oc-net
    # 注意：不要加 no-new-privileges，否则容器内的 sudo 无法修正挂载目录权限

  # ---------------------------------------------------------------------------
  # Sub2API 网关
  # ---------------------------------------------------------------------------
  sub2api:
    image: weishaw/sub2api:${SUB2API_VERSION:-0.2.20}
    container_name: oc-sub2api
    restart: unless-stopped
    # 只有部署本地网关时才启动；外接已有 Sub2API 时跳过
    profiles: ["local-gw"]
    ports:
      # 只绑本机，供 SSH 隧道进后台填上游。
      # 想从外面直接访问就设 SSH 隧道：
      #   ssh -L 18082:127.0.0.1:18082 root@服务器
      # 然后浏览器打开 http://127.0.0.1:18082
      - "127.0.0.1:${SUB2API_LOCAL_PORT:-18082}:8080"
    expose:
      - "8080"
    volumes:
      - ./data/sub2api:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=release
      - RUN_MODE=standard

      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD（至少 8 位）}

      - JWT_SECRET=${JWT_SECRET:?请设置 JWT_SECRET（至少 32 字节）}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}

      - TZ=${TZ:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - LOG_SERVICE_NAME=sub2api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oc-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: oc-postgres
    restart: unless-stopped
    profiles: ["local-gw"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - oc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: oc-redis
    restart: unless-stopped
    profiles: ["local-gw"]
    volumes:
      - ./data/redis:/data
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:-}
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    networks:
      - oc-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Command Code 订阅代理（可选）
  #
  # Command Code 的普通订阅只能走私有接口 /alpha/generate，
  # /provider/v1/chat/completions 需要 Provider 付费档。
  # 这个代理把前者翻译成标准 OpenAI 接口。
  #
  # 只有当 .env 里填了 CC_API_KEY 时才会启动（profile: cc）。
  # 关键优势：它和 sub2api 在同一个 Docker 网络，
  # 不需要 404.rw 教程里的 socat 网桥那一套。
  # ---------------------------------------------------------------------------
  cc-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.ccproxy
      args:
        CC_PROXY_VERSION: ${CC_PROXY_VERSION:-0.4.1}
    image: oc-stack/ccproxy:${CC_PROXY_VERSION:-0.4.1}
    container_name: oc-cc-proxy
    restart: unless-stopped
    profiles: ["cc"]
    expose:
      - "8787"
    environment:
      - CC_API_KEY=${CC_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8787
      - CC_IDLE_TIMEOUT_MS=${CC_IDLE_TIMEOUT_MS:-300000}
      - CC_UPSTREAM_TIMEOUT_MS=${CC_UPSTREAM_TIMEOUT_MS:-600000}
      - LOG_LEVEL=${CC_LOG_LEVEL:-info}
    networks:
      - oc-net
    security_opt:
      - no-new-privileges:true

networks:
  oc-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
